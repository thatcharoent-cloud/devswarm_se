# config/providers.yaml
# Provider registry and model catalog for the hybrid swarm.
# API keys are read strictly from environment variables. Do NOT put raw keys here.

providers:
  ollama:
    type: "ollama"
    base_url: "http://127.0.0.1:11434"
    api_key_env: "OLLAMA_API_KEY"
    default_timeout_s: 180.0
    max_retries: 3
    rate_limit:
      requests_per_minute: 120

  openai:
    type: "openai_compatible"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    default_timeout_s: 60.0
    max_retries: 3
    rate_limit:
      requests_per_minute: 60

  anthropic:
    type: "anthropic"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    default_timeout_s: 60.0
    max_retries: 3
    rate_limit:
      requests_per_minute: 50

  deepseek:
    type: "openai_compatible"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    default_timeout_s: 60.0
    max_retries: 3
    rate_limit:
      requests_per_minute: 60

  siliconflow:
    type: "openai_compatible"
    base_url: "https://api.siliconflow.com/v1"
    api_key_env: "SILICONFLOW_API_KEY"
    default_timeout_s: 300.0
    max_retries: 3
    rate_limit:
      requests_per_minute: 60

  gemini:
    type: "openai_compatible"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GEMINI_API_KEY"
    default_timeout_s: 60.0
    max_retries: 3
    rate_limit:
      requests_per_minute: 60

# Model catalog with capabilities and pricing ($ per 1M tokens)
# Users replace placeholder model IDs (<set model id>) with their selected models.
models:
  # Anthropic models
  "claude-3-7-sonnet":
    provider: "anthropic"
    context_window: 200000
    capabilities:
      tools: true
      json_schema: true
      thinking: true
      web_search_native: false
    pricing:
      input_per_million: 3.00
      output_per_million: 15.00

